<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Calendar</title>
<style>
  :root { --bg:#ffffff; --fg:#37352f; --mute:#9b9a97; --sat:#2f6fb6; --sun:#d44c47; --today-bg:#eb5757; --today-fg:#fff; --line:#ececeb; --hover:#f1f1ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#191919; --fg:#e6e6e5; --mute:#7d7c78; --sat:#6ea8e8; --sun:#f07b76; --line:#2f2f2f; --hover:#2a2a2a; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif; }
  .cal { max-width:320px; margin:0 auto; padding:6px 8px; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .title { font-weight:600; font-size:14px; cursor:pointer; }
  button { border:0; background:transparent; color:var(--mute); font-size:16px; width:26px; height:24px; border-radius:4px; cursor:pointer; }
  button:hover { background:var(--hover); color:var(--fg); }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  th { font-size:11px; font-weight:500; color:var(--mute); padding:2px 0; border-bottom:1px solid var(--line); }
  td { text-align:center; font-size:12.5px; height:25px; padding:0; }
  td span { display:inline-block; min-width:22px; line-height:22px; border-radius:11px; }
  .sat { color:var(--sat); }
  .sun, .hol { color:var(--sun); }
  .out span { opacity:.3; }
  .today span { background:var(--today-bg); color:var(--today-fg); font-weight:600; }
</style>
</head>
<body>
<div class="cal">
  <div class="head">
    <button id="prev" aria-label="前の月">‹</button>
    <div class="title" id="title" title="今月に戻る"></div>
    <button id="next" aria-label="次の月">›</button>
  </div>
  <table><thead><tr id="dow"></tr></thead><tbody id="grid"></tbody></table>
</div>
<script>
// 月曜始まり（Scheduleページの MONDAY〜WEEKEND に合わせる）。?start=sun で日曜始まり。
const sundayStart = new URLSearchParams(location.search).get('start') === 'sun';
const names = sundayStart ? ['日','月','火','水','木','金','土'] : ['月','火','水','木','金','土','日'];
let holidays = {};
const now = new Date();
let y = now.getFullYear(), m = now.getMonth();

document.getElementById('dow').innerHTML = names.map(n =>
  `<th class="${n==='土'?'sat':n==='日'?'sun':''}">${n}</th>`).join('');

const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function render() {
  document.getElementById('title').textContent = `${y}年 ${m+1}月`;
  const first = new Date(y, m, 1);
  const offset = sundayStart ? first.getDay() : (first.getDay() + 6) % 7;
  const start = new Date(y, m, 1 - offset);
  const todayKey = key(new Date());
  let html = '';
  for (let w = 0; w < 6; w++) {
    html += '<tr>';
    for (let i = 0; i < 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w*7 + i);
      const k = key(d), cls = [];
      if (d.getMonth() !== m) cls.push('out');
      if (d.getDay() === 6) cls.push('sat');
      if (d.getDay() === 0) cls.push('sun');
      if (holidays[k]) cls.push('hol');
      if (k === todayKey) cls.push('today');
      html += `<td class="${cls.join(' ')}"${holidays[k] ? ` title="${holidays[k]}"` : ''}><span>${d.getDate()}</span></td>`;
    }
    html += '</tr>';
    // 6行目が丸ごと翌月なら省く
    if (w === 4 && new Date(start.getFullYear(), start.getMonth(), start.getDate() + 35).getMonth() !== m) break;
  }
  document.getElementById('grid').innerHTML = html;
}
const shift = n => { m += n; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } render(); };
document.getElementById('prev').onclick = () => shift(-1);
document.getElementById('next').onclick = () => shift(1);
document.getElementById('title').onclick = () => { y = now.getFullYear(); m = now.getMonth(); render(); };
render();
// 日本の祝日（取れなければ土日色分けのみ）
fetch('https://holidays-jp.github.io/api/v1/date.json')
  .then(r => r.json()).then(j => { holidays = j; render(); }).catch(() => {});
</script>
</body>
</html>
